services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: codeinsights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: codeinsights
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeinsights"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: codeinsights:local
    environment:
      ConnectionStrings__CodeInsights: ${ConnectionStrings__CodeInsights:?Set the Npgsql connection string using host db}
      Bootstrap__AdminEmail: ${Bootstrap__AdminEmail:-admin@codeinsights.local}
      Bootstrap__AdminPassword: ${Bootstrap__AdminPassword:?Set the administrator bootstrap password}
      Authentication__SigningKey: ${Authentication__SigningKey:?Set a signing key of at least 32 bytes}
      Ingestion__BlobConnectionString: ${Ingestion__BlobConnectionString:?Set the Azurite connection string using host reports}
      Ingestion__PlatformUrl: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      reports:
        condition: service_started

  reports:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNTS:?Set account-name:base64-key for local report storage}
    volumes:
      - reports_data:/data

volumes:
  db_data:
  reports_data:
