# Dependencies for running the API and the web app from the IDE (Run and Debug).
# Isolated from docker-compose.yml: own project name and volumes, loopback-only ports.
name: codeinsights-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: codeinsights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: codeinsights
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeinsights"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Azurite default development account, reached by the API with UseDevelopmentStorage=true.
  reports:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - reports_data:/data

volumes:
  db_data:
  reports_data:
